# A StatefulSet (not a Deployment) because PostgreSQL needs a stable identity and
# its own persistent volume — durable storage (Server_Design.md §2.1), unlike
# every other service here which is stateless and horizontally scalable.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kfchess
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: kfchess-postgres-secret }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kfc"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: pg-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kfchess
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
