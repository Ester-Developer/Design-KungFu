# Shared config for all six cloud services (Server_Design.md §3) — every service
# is the same image (see ../Dockerfile); MAIN_CLASS in each Deployment picks which
# one a pod runs. Host/port values here match the Kubernetes Service names defined
# in the other manifests (Service DNS is the in-cluster equivalent of the
# docker-compose service-name networking already proven to work).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kfchess-config
  namespace: kfchess
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  PG_HOST: "postgres"
  PG_PORT: "5432"
  NATS_HOST: "nats"
  NATS_PORT: "4222"
  AUTH_HOST: "auth-service"
  AUTH_PORT: "8000"
  ALLOCATOR_HOST: "game-allocator"
  ALLOCATOR_PORT: "8004"
  MATCHMAKER_HOST: "matchmaker"
  MATCHMAKER_PORT: "8003"

---
apiVersion: v1
kind: Secret
metadata:
  name: kfchess-postgres-secret
  namespace: kfchess
type: Opaque
stringData:
  POSTGRES_USER: kfc
  POSTGRES_PASSWORD: kfc
  POSTGRES_DB: kfc
