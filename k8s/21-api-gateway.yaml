apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: kfchess
spec:
  # Stateless — safe to run more than one replica (Server_Design.md §2.2/§2.4).
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: kfchess:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: kfchess-config }
          env:
            - { name: MAIN_CLASS, value: com.kungfuchess.cloud.services.ApiGatewayMain }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: kfchess
spec:
  # Client-facing REST entry point — LoadBalancer so it's reachable from outside
  # the cluster (on Docker Desktop's local K8s this publishes to localhost:8080,
  # the same address run_cloud_client.bat / docker-compose already use).
  type: LoadBalancer
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
