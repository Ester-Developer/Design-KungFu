apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-allocator
  namespace: kfchess
spec:
  replicas: 1
  selector:
    matchLabels: { app: game-allocator }
  template:
    metadata:
      labels: { app: game-allocator }
    spec:
      containers:
        - name: game-allocator
          image: kfchess:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: kfchess-config }
          env:
            - { name: MAIN_CLASS, value: com.kungfuchess.cloud.services.GameAllocatorMain }
          ports:
            - containerPort: 8004
          readinessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: game-allocator
  namespace: kfchess
spec:
  # Internal only — called by the WS Gateway and Matchmaker.
  type: ClusterIP
  selector: { app: game-allocator }
  ports:
    - port: 8004
      targetPort: 8004
